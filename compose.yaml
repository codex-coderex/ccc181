services:
  db:
    image: postgres:17
    container_name: signalq-db
    environment:
      POSTGRES_USER: signalq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: signalq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalq -d signalq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: